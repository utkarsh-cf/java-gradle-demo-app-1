/*
 * This build file was set up to mirror jenkins-docs/java-gradle-demo-app-1,
 * but using Gradle instead of Maven as the build tool.
 */

plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

group = 'com.mycompany.app'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'com.mycompany.app.App'
}

// Make the plain `./gradlew build` jar runnable directly with `java -jar`,
// mirroring the runnable artifact you'd get from the Maven build.
jar {
    manifest {
        attributes 'Main-Class': 'com.mycompany.app.App'
    }
}

test {
    useJUnitPlatform()

    // Always run tests, even if the code hasn't changed.
    outputs.upToDateWhen { false }

    // Emit a JUnit-style XML report so Jenkins' junit step can pick it up,
    // just like Surefire does for the Maven version of this app.
    reports {
        junitXml.required = true
        html.required = true
    }
}
