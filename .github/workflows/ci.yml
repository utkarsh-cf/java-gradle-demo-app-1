name: CI Build and Parity Check

on:
  push:
    branches:
      - main
      - master
      - sarayu-gh
  pull_request:

jobs:
  build-and-compare:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build and test
        run: ./gradlew clean test assemble --no-daemon

      - name: Generate dependency tree
        run: ./gradlew -q dependencies --configuration runtimeClasspath > dependency-tree.txt

      - name: Package GitHub artifact
        run: |
          mkdir -p gh-build-package
          JAR_PATH=$(find build/libs -name "*.jar" -maxdepth 1 | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "No jar generated in build/libs"
            exit 1
          fi
          cp "$JAR_PATH" gh-build-package/app-github.jar
          cp dependency-tree.txt gh-build-package/
          cd gh-build-package
          zip -r ../app-github.zip .

      - name: Upload artifact package
        uses: actions/upload-artifact@v4
        with:
          name: github-build-package
          path: |
            app-github.zip
            dependency-tree.txt

